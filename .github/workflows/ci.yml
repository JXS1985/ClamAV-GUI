name: ClamAV Security Center CI (Multi-Distro KDE & GNOME)

on:
  workflow_dispatch:

jobs:
  test-matrix:
    name: "${{ matrix.distro.name }} (${{ matrix.desktop }})"
    strategy:
      fail-fast: false
      max-parallel: 2
      matrix:
        distro:
          - id: opensuse-16
            name: openSUSE Leap 16
            image: registry.opensuse.org/opensuse/leap:16.0
            pkg_mgr: zypper
            pkg_type: rpm
            rpm_flavor: opensuse
            dist_tag: lp160
          - id: opensuse-16.1
            name: openSUSE Leap 16.1
            image: registry.opensuse.org/opensuse/leap:16.1
            pkg_mgr: zypper
            pkg_type: rpm
            rpm_flavor: opensuse
            dist_tag: lp161
          - id: opensuse-tumbleweed
            name: openSUSE Tumbleweed
            image: docker.io/opensuse/tumbleweed:latest
            pkg_mgr: zypper
            pkg_type: rpm
            rpm_flavor: opensuse
            dist_tag: tw
          - id: rocky-10
            name: Rocky Linux 10
            image: docker.io/rockylinux/rockylinux:10
            pkg_mgr: dnf
            pkg_type: rpm
            rpm_flavor: rocky
            dist_tag: el10
          - id: fedora-45
            name: Fedora 45
            image: registry.fedoraproject.org/fedora:45
            pkg_mgr: dnf
            pkg_type: rpm
            rpm_flavor: fedora
            dist_tag: fc45
          - id: ubuntu-26.04
            name: Ubuntu 26.04
            image: docker.io/library/ubuntu:26.04
            pkg_mgr: apt
            pkg_type: deb
            rpm_flavor: none
            dist_tag: ubuntu2604
          - id: kubuntu-26.04
            name: Kubuntu 26.04
            image: docker.io/library/ubuntu:26.04
            pkg_mgr: apt
            pkg_type: deb
            rpm_flavor: none
            dist_tag: kubuntu2604
          - id: archlinux
            name: Arch Linux
            image: docker.io/library/archlinux:latest
            pkg_mgr: pacman
            pkg_type: arch
            rpm_flavor: none
            dist_tag: arch
        desktop:
          - kde
          - gnome
        exclude:
          # Ubuntu Desktop runs GNOME-only; Kubuntu runs KDE-only
          - distro:
              id: ubuntu-26.04
              name: Ubuntu 26.04
              image: docker.io/library/ubuntu:26.04
              pkg_mgr: apt
              pkg_type: deb
              rpm_flavor: none
              dist_tag: ubuntu2604
            desktop: kde
          - distro:
              id: kubuntu-26.04
              name: Kubuntu 26.04
              image: docker.io/library/ubuntu:26.04
              pkg_mgr: apt
              pkg_type: deb
              rpm_flavor: none
              dist_tag: kubuntu2604
            desktop: gnome

    # GitHub-hosted Ubuntu runners executing each target distro in its container image
    # (opensuse-16, opensuse-16.1, opensuse-tumbleweed, rocky-10, fedora-45, and archlinux on kde & gnome;
    # ubuntu-26.04 on gnome; kubuntu-26.04 on kde).
    runs-on: ubuntu-latest
    container:
      image: ${{ matrix.distro.image }}

    env:
      PYTHONDONTWRITEBYTECODE: "1"
      DISTRO_ID: ${{ matrix.distro.id }}
      PKG_MGR: ${{ matrix.distro.pkg_mgr }}
      PKG_TYPE: ${{ matrix.distro.pkg_type }}
      RPM_FLAVOR: ${{ matrix.distro.rpm_flavor }}
      DIST_TAG: ${{ matrix.distro.dist_tag }}
      TARGET_DESKTOP: ${{ matrix.desktop }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Inspect OS and desktop environment
        run: |
          cat /etc/os-release || true
          echo "Target desktop: ${TARGET_DESKTOP} | Package type: ${PKG_TYPE}"
          echo "Active XDG_CURRENT_DESKTOP=${XDG_CURRENT_DESKTOP:-unset}"
          echo "Active DBUS_SESSION_BUS_ADDRESS=${DBUS_SESSION_BUS_ADDRESS:-unset}"
          echo "Active WAYLAND_DISPLAY=${WAYLAND_DISPLAY:-unset} DISPLAY=${DISPLAY:-unset}"

      - name: Install runtime, packaging, and Qt6 dependencies
        run: |
          SUDO=""
          if [ "$(id -u)" -ne 0 ] && command -v sudo >/dev/null 2>&1; then
            SUDO="sudo"
          fi

          case "${PKG_MGR}" in
            zypper)
              ${SUDO} zypper --non-interactive refresh
              ${SUDO} zypper --non-interactive install --no-recommends -y \
                python3 python3-pyside6 clamav findutils util-linux polkit procps \
                libnotify-tools rpm-build desktop-file-utils xvfb-run glib2-tools tar gzip
              if [ "${TARGET_DESKTOP}" = "gnome" ]; then
                ${SUDO} zypper --non-interactive install --no-recommends -y \
                  xdg-desktop-portal-gtk adwaita-icon-theme python3-gobject || true
              else
                ${SUDO} zypper --non-interactive install --no-recommends -y xdg-desktop-portal-kde || true
              fi
              ;;

            dnf)
              if grep -qiE 'rocky|rhel|almalinux' /etc/os-release 2>/dev/null; then
                ${SUDO} dnf install -y epel-release || true
                ${SUDO} dnf config-manager --set-enabled crb || true
              fi
              ${SUDO} dnf install -y \
                python3 python3-pip clamav clamav-freshclam findutils util-linux polkit procps-ng \
                libnotify rpm-build desktop-file-utils glib2 \
                mesa-dri-drivers libxkbcommon libxkbcommon-x11 tar gzip
              ${SUDO} dnf install -y xorg-x11-server-Xvfb || ${SUDO} dnf install -y xorg-x11-server-Xwayland || true
              ${SUDO} dnf install -y python3-pyside6 || ${SUDO} dnf install -y python3-pyqt6 || true
              if [ "${TARGET_DESKTOP}" = "gnome" ]; then
                ${SUDO} dnf install -y qt6-qtwayland xdg-desktop-portal-gtk \
                  adwaita-icon-theme python3-gobject || true
              else
                ${SUDO} dnf install -y plasma-integration qt6-qtwayland xdg-desktop-portal-kde || true
              fi
              ;;

            apt)
              ${SUDO} apt-get update
              DEBIAN_FRONTEND=noninteractive ${SUDO} apt-get install -y --no-install-recommends \
                ca-certificates python3 python3-pip clamav clamav-freshclam findutils util-linux polkitd \
                libnotify-bin dpkg-dev desktop-file-utils libglib2.0-bin xvfb xauth \
                libxkbcommon-x11-0 libegl1 libgl1 libdbus-1-3
              DEBIAN_FRONTEND=noninteractive ${SUDO} apt-get install -y --no-install-recommends \
                python3-pyside6.qtwidgets python3-pyside6.qtgui python3-pyside6.qtcore python3-pyside6.qttest \
                || DEBIAN_FRONTEND=noninteractive ${SUDO} apt-get install -y --no-install-recommends python3-pyqt6 \
                || true
              if [ "${TARGET_DESKTOP}" = "gnome" ]; then
                DEBIAN_FRONTEND=noninteractive ${SUDO} apt-get install -y --no-install-recommends \
                  xdg-desktop-portal-gtk adwaita-icon-theme python3-gi gir1.2-glib-2.0 || true
              else
                DEBIAN_FRONTEND=noninteractive ${SUDO} apt-get install -y --no-install-recommends xdg-desktop-portal-kde || true
              fi
              ;;

            pacman)
              ${SUDO} sed -i 's/^#DisableSandbox/DisableSandbox/' /etc/pacman.conf || true
              ${SUDO} pacman -Syu --noconfirm --needed \
                python python-pip pyside6 clamav findutils util-linux polkit procps-ng \
                libnotify desktop-file-utils xorg-server-xvfb glib2 tar zstd libarchive \
                mesa libxkbcommon libxkbcommon-x11 dbus qt6-wayland
              if [ "${TARGET_DESKTOP}" = "gnome" ]; then
                ${SUDO} pacman -S --noconfirm --needed \
                  xdg-desktop-portal-gtk adwaita-icon-theme python-gobject || true
              else
                ${SUDO} pacman -S --noconfirm --needed xdg-desktop-portal-kde breeze-icons || true
              fi
              ${SUDO} sed -i 's/^#en_US.UTF-8 UTF-8/en_US.UTF-8 UTF-8/; s/^#de_DE.UTF-8 UTF-8/de_DE.UTF-8 UTF-8/' /etc/locale.gen || true
              ${SUDO} locale-gen || true
              ;;

            *)
              echo "Unsupported package manager: ${PKG_MGR}" >&2
              exit 1
              ;;
          esac

          python3 --version
          if ! python3 -c "import PySide6.QtWidgets, PySide6.QtTest" 2>/dev/null \
             && ! python3 -c "import PyQt6.QtWidgets, PyQt6.QtTest" 2>/dev/null; then
            python3 -m pip install --no-cache-dir --break-system-packages PySide6 \
              || python3 -m pip install --no-cache-dir --user --break-system-packages PySide6
          fi

      - name: Verify Python bytecode compilation and scripts
        run: |
          python3 -m compileall -q clamav_gui.py clamav_backend tests packaging/verify_installed_os.py
          bash -n run.sh
          bash -n packaging/build_packages.sh
          bash -n packaging/PKGBUILD
          if command -v desktop-file-validate >/dev/null 2>&1; then
            desktop-file-validate clamav-security-center.desktop
          fi

      - name: Run full backend and UI test suite (English & German)
        run: |
          if [ "${TARGET_DESKTOP}" = "kde" ]; then
            export XDG_CURRENT_DESKTOP="KDE"
            export DESKTOP_SESSION="plasma"
          else
            export XDG_CURRENT_DESKTOP="GNOME"
            export DESKTOP_SESSION="gnome"
          fi

          QT_QPA_PLATFORM=offscreen LANG=en_US.UTF-8 LC_ALL=en_US.UTF-8 \
            python3 -m unittest discover -s tests -v

          QT_QPA_PLATFORM=offscreen LANG=de_DE.UTF-8 LC_ALL=de_DE.UTF-8 \
            python3 -m unittest discover -s tests -v

      - name: Run live ClamAV UI and helper tests as an unprivileged user
        env:
          QT_QPA_PLATFORM: offscreen
          CLAMAV_GUI_LIVE_TEST: "1"
        run: |
          if [ "$(id -u)" -eq 0 ]; then
            smoke_dir=$(mktemp -d)
            trap 'rm -rf "${smoke_dir}"' EXIT
            chmod 755 "${smoke_dir}"
            cp -R clamav_gui.py clamav_backend tests "${smoke_dir}/"
            cd "${smoke_dir}"
            runuser -u nobody -- python3 -m unittest -v tests.test_ui_clamav_gui.TestUILiveClamAV \
              tests.test_clamav_gui.TestWindowsCompatibility.test_frozen_self_test_fallback_temp_log
          else
            python3 -m unittest -v tests.test_ui_clamav_gui.TestUILiveClamAV
          fi

      - name: Build and install native DEB / RPM / Arch package on runner OS
        run: |
          SUDO=""
          if [ "$(id -u)" -ne 0 ] && command -v sudo >/dev/null 2>&1; then
            SUDO="sudo"
          fi

          chmod +x packaging/build_packages.sh
          if [ "${PKG_TYPE}" = "rpm" ]; then
            ./packaging/build_packages.sh \
              --type rpm \
              --rpm-flavor "${RPM_FLAVOR}" \
              --dist-tag "${DIST_TAG}" \
              --version 0.0.1 \
              --release ci \
              --out-dir dist-ci

            if [ "${PKG_MGR}" = "zypper" ]; then
              ${SUDO} zypper --non-interactive --no-gpg-checks install -y ./dist-ci/*.rpm
            else
              ${SUDO} dnf install -y ./dist-ci/*.rpm
            fi
          elif [ "${PKG_TYPE}" = "arch" ]; then
            ./packaging/build_packages.sh \
              --type arch \
              --version 0.0.1 \
              --release ci \
              --out-dir dist-ci

            ${SUDO} pacman -U --noconfirm ./dist-ci/*.pkg.tar.zst
          else
            ./packaging/build_packages.sh \
              --type deb \
              --version 0.0.1 \
              --release ci \
              --out-dir dist-ci

            DEBIAN_FRONTEND=noninteractive ${SUDO} apt-get install -y ./dist-ci/*.deb
          fi

      - name: Verify installed package, Start Menu entry, and Notification Panel / Tray integration
        run: |
          if [ "${TARGET_DESKTOP}" = "kde" ]; then
            export XDG_CURRENT_DESKTOP="KDE"
            export DESKTOP_SESSION="plasma"
          else
            export XDG_CURRENT_DESKTOP="GNOME"
            export DESKTOP_SESSION="gnome"
          fi

          python3 packaging/verify_installed_os.py \
            --pkg-type "${PKG_TYPE}" \
            --desktop "${TARGET_DESKTOP}"

      - name: Launch the installed desktop application
        run: |
          if [ "${TARGET_DESKTOP}" = "kde" ]; then
            export XDG_CURRENT_DESKTOP="KDE"
            export DESKTOP_SESSION="plasma"
          else
            export XDG_CURRENT_DESKTOP="GNOME"
            export DESKTOP_SESSION="gnome"
          fi

          for gui_lang in en de; do
            set +e
            if [ -n "${WAYLAND_DISPLAY:-}" ] || [ -n "${DISPLAY:-}" ]; then
              timeout 4s /usr/bin/clamav-security-center --lang "${gui_lang}"
              rc=$?
            elif command -v xvfb-run >/dev/null 2>&1; then
              QT_QPA_PLATFORM=xcb timeout 4s xvfb-run -a /usr/bin/clamav-security-center --lang "${gui_lang}"
              rc=$?
            else
              QT_QPA_PLATFORM=offscreen timeout 4s /usr/bin/clamav-security-center --lang "${gui_lang}"
              rc=$?
            fi
            set -e
            if [ "${rc}" -ne 0 ] && [ "${rc}" -ne 124 ]; then
              echo "Installed GUI smoke test (${TARGET_DESKTOP}, --lang ${gui_lang}) failed with exit code ${rc}" >&2
              exit "${rc}"
            fi
            echo "Installed GUI smoke test passed for desktop=${TARGET_DESKTOP}, lang=${gui_lang} (rc=${rc})"
          done

      - name: Clean up installed test package
        if: always()
        run: |
          SUDO=""
          if [ "$(id -u)" -ne 0 ] && command -v sudo >/dev/null 2>&1; then
            SUDO="sudo"
          fi

          case "${PKG_MGR}" in
            zypper) ${SUDO} zypper --non-interactive remove -y clamav-security-center || true ;;
            dnf)    ${SUDO} dnf remove -y clamav-security-center || true ;;
            apt)    DEBIAN_FRONTEND=noninteractive ${SUDO} apt-get remove -y clamav-security-center || true ;;
            pacman) ${SUDO} pacman -R --noconfirm clamav-security-center || true ;;
          esac
          rm -rf dist-ci

  test-windows:
    name: Windows (Python + PySide6 + ClamAV)
    needs: [test-matrix]
    if: ${{ !cancelled() }}
    runs-on: windows-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Install ClamAV via Chocolatey
        run: choco install clamav -y --no-progress

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install PySide6 and PyInstaller
        run: python -m pip install --upgrade pip PySide6 pyinstaller

      - name: Compile-check Python modules
        run: python -m compileall -q clamav_gui.py clamav_backend tests

      - name: Run self-test
        env:
          QT_QPA_PLATFORM: offscreen
        run: python clamav_gui.py --self-test

      - name: Run unit and UI tests
        env:
          QT_QPA_PLATFORM: offscreen
          CLAMAV_GUI_LIVE_TEST: "1"
        run: python -m unittest discover -s tests -v

      - name: Build and run clamav-security-center.exe --self-test smoke test
        shell: pwsh
        env:
          QT_QPA_PLATFORM: offscreen
        run: |
          pyinstaller --noconfirm --clean --onefile --console --hide-console hide-early `
            --name clamav-security-center `
            --add-data "packaging/clamav-security-center.svg;packaging" `
            clamav_gui.py
          if (-not (Test-Path "dist/clamav-security-center.exe")) {
            Write-Error "dist/clamav-security-center.exe was not built"
            exit 1
          }
          $out = & .\dist\clamav-security-center.exe --self-test 2>&1 | Out-String
          Write-Host $out
          if ($LASTEXITCODE -ne 0 -or $out -notmatch "ALL CHECKS PASSED") {
            Write-Error "clamav-security-center.exe --self-test failed (exit=$LASTEXITCODE)"
            exit 1
          }

  test-macos:
    name: macOS (Python + PySide6 + ClamAV)
    needs: [test-matrix]
    if: ${{ !cancelled() }}
    runs-on: macos-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Install ClamAV via Homebrew
        env:
          HOMEBREW_NO_AUTO_UPDATE: "1"
          HOMEBREW_NO_INSTALL_CLEANUP: "1"
        run: brew install clamav

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install PySide6 and PyInstaller
        run: python -m pip install --upgrade pip PySide6 pyinstaller

      - name: Compile-check Python modules
        run: python -m compileall -q clamav_gui.py clamav_backend tests

      - name: Run self-test
        env:
          QT_QPA_PLATFORM: offscreen
        run: python clamav_gui.py --self-test

      - name: Run unit and UI tests
        env:
          QT_QPA_PLATFORM: offscreen
          CLAMAV_GUI_LIVE_TEST: "1"
        run: python -m unittest discover -s tests -v

      - name: Build and run packaged PyInstaller --self-test smoke test
        env:
          QT_QPA_PLATFORM: offscreen
        run: |
          pyinstaller --noconfirm --clean --onefile --windowed \
            --name clamav-security-center \
            --add-data "packaging/clamav-security-center.svg:packaging" \
            clamav_gui.py
          if [ -x "dist/clamav-security-center.app/Contents/MacOS/clamav-security-center" ]; then
            BIN="dist/clamav-security-center.app/Contents/MacOS/clamav-security-center"
          elif [ -x "dist/clamav-security-center" ]; then
            BIN="dist/clamav-security-center"
          else
            echo "Built macOS binary not found under dist/" >&2
            exit 1
          fi
          OUT="$("${BIN}" --self-test 2>&1)"
          echo "${OUT}"
          echo "${OUT}" | grep -q "ALL CHECKS PASSED"
