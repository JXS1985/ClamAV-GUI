name: Build & Release DEB, RPM, Arch, Windows & macOS Packages

# Trigger manually via Actions -> Run workflow.
on:
  workflow_dispatch:
    inputs:
      version:
        description: "Package version (e.g. 1.0.0)"
        required: true
        default: "1.0.0"
        type: string
      release:
        description: "Package release number (e.g. 1)"
        required: false
        default: "1"
        type: string

jobs:
  build-deb:
    name: Build DEB (Ubuntu / Kubuntu 26.04)
    runs-on: ubuntu-latest
    container:
      image: docker.io/library/ubuntu:26.04
    env:
      INPUT_VERSION: ${{ inputs.version }}
      PKG_RELEASE: ${{ inputs.release || '1' }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install DEB packaging tools
        run: |
          SUDO=""
          if [ "$(id -u)" -ne 0 ] && command -v sudo >/dev/null 2>&1; then
            SUDO="sudo"
          fi
          ${SUDO} apt-get update
          DEBIAN_FRONTEND=noninteractive ${SUDO} apt-get install -y --no-install-recommends \
            ca-certificates dpkg-dev desktop-file-utils python3

      - name: Build .deb package
        run: |
          PKG_VERSION="${INPUT_VERSION:-${GITHUB_REF_NAME#v}}"
          PKG_VERSION="${PKG_VERSION#v}"
          echo "Resolved package version: ${PKG_VERSION}-${PKG_RELEASE}"
          chmod +x packaging/build_packages.sh
          ./packaging/build_packages.sh \
            --type deb \
            --version "${PKG_VERSION}" \
            --release "${PKG_RELEASE}" \
            --out-dir dist
          (cd dist && sha256sum *.deb > SHA256SUMS.deb.txt)
          ls -lh dist/

      - name: Upload .deb package artifact
        uses: actions/upload-artifact@v4
        with:
          name: clamav-security-center-deb-${{ inputs.version || github.ref_name }}-${{ inputs.release || '1' }}
          path: |
            dist/*.deb
            dist/SHA256SUMS.deb.txt

  build-arch:
    name: Build Arch Linux (.pkg.tar.zst)
    runs-on: ubuntu-latest
    container:
      image: docker.io/library/archlinux:latest
    env:
      INPUT_VERSION: ${{ inputs.version }}
      PKG_RELEASE: ${{ inputs.release || '1' }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install Arch packaging tools
        run: |
          SUDO=""
          if [ "$(id -u)" -ne 0 ] && command -v sudo >/dev/null 2>&1; then
            SUDO="sudo"
          fi
          ${SUDO} sed -i 's/^#DisableSandbox/DisableSandbox/' /etc/pacman.conf || true
          ${SUDO} pacman -Syu --noconfirm --needed \
            bash tar zstd libarchive desktop-file-utils python coreutils findutils sed gawk

      - name: Build .pkg.tar.zst package
        run: |
          PKG_VERSION="${INPUT_VERSION:-${GITHUB_REF_NAME#v}}"
          PKG_VERSION="${PKG_VERSION#v}"
          echo "Resolved Arch package version: ${PKG_VERSION}-${PKG_RELEASE}"
          chmod +x packaging/build_packages.sh
          ./packaging/build_packages.sh \
            --type arch \
            --version "${PKG_VERSION}" \
            --release "${PKG_RELEASE}" \
            --out-dir dist
          (cd dist && sha256sum *.pkg.tar.zst > SHA256SUMS.arch.txt)
          ls -lh dist/

      - name: Upload Arch package artifact
        uses: actions/upload-artifact@v4
        with:
          name: clamav-security-center-arch-${{ inputs.version || github.ref_name }}-${{ inputs.release || '1' }}
          path: |
            dist/*.pkg.tar.zst
            dist/SHA256SUMS.arch.txt

  build-rpm:
    name: "Build RPM (${{ matrix.target.name }})"
    needs: [build-deb, build-arch]
    strategy:
      fail-fast: true
      max-parallel: 2
      matrix:
        target:
          - image: registry.opensuse.org/opensuse/leap:16.0
            name: openSUSE Leap 16
            pkg_mgr: zypper
            flavor: opensuse
            dist_tag: lp160
          - image: registry.opensuse.org/opensuse/leap:16.1
            name: openSUSE Leap 16.1
            pkg_mgr: zypper
            flavor: opensuse
            dist_tag: lp161
          - image: docker.io/opensuse/tumbleweed:latest
            name: openSUSE Tumbleweed
            pkg_mgr: zypper
            flavor: opensuse
            dist_tag: tw
          - image: docker.io/rockylinux/rockylinux:10
            name: Rocky Linux 10
            pkg_mgr: dnf
            flavor: rocky
            dist_tag: el10
          - image: registry.fedoraproject.org/fedora:45
            name: Fedora 45
            pkg_mgr: dnf
            flavor: fedora
            dist_tag: fc45

    runs-on: ubuntu-latest
    container:
      image: ${{ matrix.target.image }}
    env:
      INPUT_VERSION: ${{ inputs.version }}
      PKG_RELEASE: ${{ inputs.release || '1' }}
      PKG_MGR: ${{ matrix.target.pkg_mgr }}
      RPM_FLAVOR: ${{ matrix.target.flavor }}
      DIST_TAG: ${{ matrix.target.dist_tag }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install RPM packaging tools
        run: |
          SUDO=""
          if [ "$(id -u)" -ne 0 ] && command -v sudo >/dev/null 2>&1; then
            SUDO="sudo"
          fi
          case "${PKG_MGR}" in
            zypper)
              ${SUDO} zypper --non-interactive refresh
              ${SUDO} zypper --non-interactive install --no-recommends -y \
                rpm-build desktop-file-utils python3 tar gzip
              ;;
            dnf)
              ${SUDO} dnf install -y \
                rpm-build desktop-file-utils python3 tar gzip
              ;;
            *)
              echo "Unsupported package manager: ${PKG_MGR}" >&2
              exit 1
              ;;
          esac

      - name: Build .rpm package
        run: |
          PKG_VERSION="${INPUT_VERSION:-${GITHUB_REF_NAME#v}}"
          PKG_VERSION="${PKG_VERSION#v}"
          echo "Resolved package version: ${PKG_VERSION}-${PKG_RELEASE}.${DIST_TAG}"
          chmod +x packaging/build_packages.sh
          ./packaging/build_packages.sh \
            --type rpm \
            --rpm-flavor "${RPM_FLAVOR}" \
            --dist-tag "${DIST_TAG}" \
            --version "${PKG_VERSION}" \
            --release "${PKG_RELEASE}" \
            --out-dir dist
          (cd dist && sha256sum *.rpm > "SHA256SUMS.${DIST_TAG}.txt")
          ls -lh dist/

      - name: Upload .rpm package artifact
        uses: actions/upload-artifact@v4
        with:
          name: clamav-security-center-rpm-${{ matrix.target.dist_tag }}-${{ inputs.version || github.ref_name }}-${{ inputs.release || '1' }}
          path: |
            dist/*.rpm
            dist/SHA256SUMS.*.txt

  build-windows:
    name: Build Windows x64 Bundle
    needs: [build-rpm]
    runs-on: windows-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install build dependencies
        run: python -m pip install --upgrade pip PySide6 pyinstaller pillow

      - name: Build Windows executable and zip archive
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force -Path build-win | Out-Null
          $env:QT_QPA_PLATFORM = "offscreen"
          python -c @"
          import os
          from PySide6.QtCore import Qt, QSize
          from PySide6.QtGui import QGuiApplication, QImage, QPainter
          from PySide6.QtSvg import QSvgRenderer
          from PIL import Image
          app = QGuiApplication([])
          renderer = QSvgRenderer("packaging/clamav-kde-gui.svg")
          img = QImage(QSize(256, 256), QImage.Format_ARGB32)
          img.fill(Qt.transparent)
          painter = QPainter(img)
          renderer.render(painter)
          painter.end()
          img.save("build-win/app.png")
          Image.open("build-win/app.png").save(
              "build-win/app.ico",
              sizes=[(16, 16), (32, 32), (48, 48), (64, 64), (128, 128), (256, 256)],
          )
          "@
          $iconArgs = @()
          if (Test-Path "build-win/app.ico") {
            $iconArgs = @("--icon", "build-win/app.ico")
          }
          pyinstaller --noconfirm --clean --onefile --windowed `
            --name clamav-security-center `
            @iconArgs `
            --add-data "packaging/clamav-kde-gui.svg;packaging" `
            clamav_gui.py

          New-Item -ItemType Directory -Force -Path "build-win/stage" | Out-Null
          Copy-Item "dist/clamav-security-center.exe" "build-win/stage/"
          Copy-Item "README.md", "LICENSE" "build-win/stage/"
          New-Item -ItemType Directory -Force -Path "release-win" | Out-Null
          $zipPath = "release-win/ClamAV-Security-Center-Windows-x64.zip"
          Compress-Archive -Path "build-win/stage/*" -DestinationPath $zipPath -Force
          $hash = (Get-FileHash $zipPath -Algorithm SHA256).Hash.ToLower()
          "$hash  ClamAV-Security-Center-Windows-x64.zip" | Out-File -FilePath "release-win/SHA256SUMS.windows.txt" -Encoding ascii -NoNewline

      - name: Upload Windows release artifact
        uses: actions/upload-artifact@v4
        with:
          name: packages-windows-x64
          path: |
            release-win/*.zip
            release-win/SHA256SUMS.windows.txt

  build-macos:
    name: Build macOS Bundle
    needs: [build-rpm]
    runs-on: macos-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install build dependencies
        run: python -m pip install --upgrade pip PySide6 pyinstaller

      - name: Build macOS application bundle and zip archive
        run: |
          export QT_QPA_PLATFORM=offscreen
          pyinstaller --noconfirm --clean --onefile --windowed \
            --name clamav-security-center \
            --add-data "packaging/clamav-kde-gui.svg:packaging" \
            clamav_gui.py

          mkdir -p build-mac/stage release-mac
          if [ -d "dist/clamav-security-center.app" ]; then
            ditto "dist/clamav-security-center.app" "build-mac/stage/ClamAV Security Center.app"
          elif [ -f "dist/clamav-security-center" ]; then
            cp "dist/clamav-security-center" "build-mac/stage/"
          fi
          cp README.md LICENSE "build-mac/stage/"
          (cd build-mac/stage && zip -r -y "../../release-mac/ClamAV-Security-Center-macOS.zip" .)
          (cd release-mac && shasum -a 256 ClamAV-Security-Center-macOS.zip > SHA256SUMS.macos.txt)

      - name: Upload macOS release artifact
        uses: actions/upload-artifact@v4
        with:
          name: packages-macos
          path: |
            release-mac/*.zip
            release-mac/SHA256SUMS.macos.txt

  publish-release:
    name: Publish GitHub Release
    needs: [build-deb, build-arch, build-rpm, build-windows, build-macos]
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Download built packages
        uses: actions/download-artifact@v4
        with:
          path: release-assets
          merge-multiple: true

      - name: Verify checksums and list release assets
        run: |
          ls -lh release-assets/
          cat release-assets/SHA256SUMS.*.txt > release-assets/SHA256SUMS.txt

      - name: Attach packages to GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          generate_release_notes: true
          files: |
            release-assets/*.deb
            release-assets/*.rpm
            release-assets/*.pkg.tar.zst
            release-assets/*.zip
            release-assets/SHA256SUMS*.txt
